global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    instance: mphondo-rpi

alerting:
  alertmanagers: []

scrape_configs:
  # ── FastAPI metrics ────────────────────────────────────────────────────────
  - job_name: mphondo-api
    metrics_path: /api/metrics
    static_configs:
      - targets: ["mphondo-api:8000"]
    scrape_interval: 15s

  # ── Prometheus self-scrape ─────────────────────────────────────────────────
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # ── Node exporter (RPi hardware metrics) ──────────────────────────────────
  - job_name: node-exporter
    static_configs:
      - targets: ["mphondo-node-exporter:9100"]
    scrape_interval: 30s

  # ── Redis ─────────────────────────────────────────────────────────────────
  # Habilitado si se añade redis_exporter al compose en el futuro
  # - job_name: redis
  #   static_configs:
  #     - targets: ["redis-exporter:9121"]
